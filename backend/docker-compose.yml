services:
  postgres:
    image: postgres:16-alpine
    container_name: irms_postgres
    environment:
      POSTGRES_USER: irms
      POSTGRES_PASSWORD: irms_dev_password
      POSTGRES_DB: irms
    ports:
      - "5433:5432"
    volumes:
      - irms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: irms_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  irms_pg_data:
